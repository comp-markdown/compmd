# cargo-make tasks for the Rust workspace and the TypeScript packages. `cargo make ci` runs every check.

[config]
# Run each task once for the whole workspace, not once per member crate.
default_to_workspace = false

[tasks.fmt]
description = "Check formatting"
clear = true
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
description = "Lint all targets; warnings are errors"
clear = true
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.test]
description = "Run the tests, the conformance set's among them"
clear = true
command = "cargo"
args = ["test", "--workspace", "--all-features"]

[tasks.doctest]
description = "Run the documentation examples, which coverage's run leaves out"
clear = true
command = "cargo"
args = ["test", "--workspace", "--all-features", "--doc"]

[tasks.docs]
description = "Build the crates' API docs as docs.rs does; a broken intra-doc link is an error (the crates' `rustdoc` lints)"
clear = true
command = "cargo"
args = ["doc", "--locked", "--workspace", "--all-features", "--no-deps"]

[tasks.links]
description = "Check the links in what npmjs.com, crates.io and docs.rs show of the published packages, and in the website's and the playground's sources (`lychee-inputs.txt`), offline: a link to this repository's files on GitHub, or to the spec on compmd.dev, is checked against the file here, with its anchor. Needs lychee; CI's `links` job checks every link with the network, on each push to `main` (docs/ci.md, decision 14)"
clear = true
command = "lychee"
args = [
  "--offline",
  "--remap", "^https://github\\.com/comp-markdown/compmd/(blob|tree)/main/ file://${CARGO_MAKE_WORKING_DIRECTORY}/",
  "--remap", "^https://compmd\\.dev/spec/#registry-(.*) file://${CARGO_MAKE_WORKING_DIRECTORY}/spec/compmd-registry-v1.md#$1",
  "--remap", "^https://compmd\\.dev/spec/#registry$ file://${CARGO_MAKE_WORKING_DIRECTORY}/spec/compmd-registry-v1.md",
  "--remap", "^https://compmd\\.dev/spec/ file://${CARGO_MAKE_WORKING_DIRECTORY}/spec/compmd-spec-v1.md",
  "--files-from", "lychee-inputs.txt",
]

[tasks.wasm]
description = "Build the processor, the component reader and compmd-project as WebAssembly, size-optimized; `pnpm wasm` in `npm-packages/wasm/` adds wasm-bindgen's JavaScript"
clear = true
command = "cargo"
args = ["build", "--locked", "--profile", "wasm", "--target", "wasm32-unknown-unknown", "-p", "compmd-wasm", "-p", "compmd-components-wasm", "-p", "compmd-project"]

[tasks.deny]
description = "Check dependencies: licenses, advisories, sources"
clear = true
command = "cargo"
args = ["deny", "check"]

[tasks.coverage]
description = "Measure line coverage of the workspace's crates; fails below 99%"
clear = true
command = "cargo"
# The markdown-rs fork is a path dependency inside this folder; its coverage is its own. The WebAssembly bindings'
# exports, `Intl` and the host's component reader run only as WebAssembly, where `@compmd/processor`'s tests cover
# them; its request is tested natively. The macros' entry point runs only inside the compiler; what it calls is tested
# natively.
args = ["llvm-cov", "--locked", "--workspace", "--all-features", "--ignore-filename-regex", "markdown-rs/|wasm/src/(lib|reader)\\.rs|wasm/components/src/lib\\.rs|host-js/src/js_project\\.rs|macros/src/lib\\.rs", "--fail-under-lines", "99"]

[tasks.packages]
description = "Build, lint (eslint, the type check, svelte-check; after the build, since packages check against each other's built output) and test the TypeScript packages: the renderer, the processor as WebAssembly, the sandbox (its browser tests in Chrome and WebKit), the registry (against a local registry, and in Chrome and WebKit), the Vite plugin (its example app in Chrome and WebKit), `@compmd/pack`, create-pack (a written pack, on `@compmd/pack`, in Chrome and WebKit), the Developer Tools, and the playground (its document of a pack from npm, against a local registry, in Chrome); the renderer's tests check it against the processor's `conformance/params.json`"
clear = true
script = ["pnpm -r --if-present build", "pnpm -r --if-present lint", "pnpm -r --if-present test"]

[tasks.site]
description = "Build the site and check it, as the Pages workflow does before it deploys (docs/ci.md, decision 11): every package's build, the site's last, which assembles them, then the built site's check in Chrome, without the paint timing a shared runner can't hold. Not part of `ci`: a change to the site, the guides or the spec runs it before a push"
clear = true
script = ["pnpm -r build", "pnpm --dir website check --no-timing"]

[tasks.linux]
description = "Run a check on Linux, in a container like CI's runner (tools/linux-ci/Dockerfile), on a commit of this repository: `cargo make linux` runs `cargo make ci` on HEAD; `cargo make linux site` the site's build and check, as the Pages workflow runs them; `cargo make linux <command>` any command; `cargo make linux --ref <commit> …` another commit. Needs Docker; x86-64 runs emulated on an Arm Mac."
clear = true
# The repository's git folder, also when the checkout is a submodule or a worktree, so the container checks out its
# commits and tags; the caches in named volumes, so a later run reuses the build.
script = '''
docker build --platform linux/amd64 --tag compmd-linux --file tools/linux-ci/Dockerfile .
docker run --rm --platform linux/amd64 \
  --volume "$(git rev-parse --path-format=absolute --git-common-dir):/git:ro" \
  --volume compmd-linux-target:/work/target \
  --volume compmd-linux-cargo:/usr/local/cargo/registry \
  --volume compmd-linux-cache:/cache \
  compmd-linux ${@}
'''

[tasks.tauri-plugin]
description = "Lint and test `tauri-plugin-compmd`, with its features and without, measure its coverage (fails below 99%), build its API docs (a broken intra-doc link fails) and check its dependencies with cargo-deny. Outside the workspace and `ci`, since it builds Tauri: the Tauri check runs it (docs/tauri-plugin.md, decision 10)"
clear = true
script = [
  "cargo fmt --manifest-path crates/tauri/Cargo.toml -- --check",
  "cargo clippy --locked --manifest-path crates/tauri/Cargo.toml --all-targets -- -D warnings",
  "cargo clippy --locked --manifest-path crates/tauri/Cargo.toml --all-targets --all-features -- -D warnings",
  # A webview's requests come in through `scheme.rs`, and `build::bundle` runs in an app's build script, which only
  # Cargo calls: the example app's check covers both, and the functions they call are tested here.
  "cargo llvm-cov --locked --manifest-path crates/tauri/Cargo.toml --all-features --ignore-filename-regex 'tauri/src/scheme\\.rs' --fail-under-lines 99",
  "cargo test --manifest-path crates/tauri/Cargo.toml --all-features --doc",
  "cargo doc --locked --manifest-path crates/tauri/Cargo.toml --all-features --no-deps",
  # Its dependencies against its own `deny.toml`: the root's policy, with what Tauri brings in decided one by one.
  "cargo deny --manifest-path crates/tauri/Cargo.toml check",
]

[tasks.tauri-check]
description = "The Tauri check (docs/tauri-plugin.md, decisions 9 and 10): the plugin's checks, then the example app's tests and build, and the app run in a real webview with `--check` and `--check-broken`, each exiting 0 only when it drew what it should. On Linux, run it under `xvfb-run`; CI does"
clear = true
dependencies = ["tauri-plugin"]
script = [
  "pnpm --filter @compmd/tauri-example... build",
  "cargo fmt --manifest-path crates/tauri/examples/tauri-app/src-tauri/Cargo.toml -- --check",
  "cargo clippy --manifest-path crates/tauri/examples/tauri-app/src-tauri/Cargo.toml --all-targets -- -D warnings",
  "cargo test --manifest-path crates/tauri/examples/tauri-app/src-tauri/Cargo.toml",
  "cargo build --manifest-path crates/tauri/examples/tauri-app/src-tauri/Cargo.toml --features custom-protocol",
  "crates/tauri/examples/tauri-app/src-tauri/target/debug/compmd-tauri-example --check",
  "crates/tauri/examples/tauri-app/src-tauri/target/debug/compmd-tauri-example --check-broken",
]

[tasks.neovim-check]
description = "The Neovim plugin (editors/neovim/) in a headless Neovim, installed as a writer installs it, against local builds: the file type, the three parsers and their queries through nvim-treesitter, and compmd-lsp through lsp/compmd.lua. Needs nvim (0.12 or later), git and the tree-sitter CLI; not part of ci"
clear = true
dependencies = ["neovim-build"]
command = "nvim"
args = ["--headless", "-l", "editors/neovim/test/check.lua", "target/neovim/nvim-treesitter", "grammars/compmd-grammars", "target/neovim/site", "target/debug/compmd-lsp"]

[tasks.nvim-interactive]
description = "An interactive Neovim with the plugin (editors/neovim/) against local builds, in place of your own config: `cargo make nvim-interactive [file]`, the Author's Guide's containers example without one. Needs nvim (0.12 or later), git and the tree-sitter CLI"
clear = true
dependencies = ["neovim-build"]
command = "nvim"
args = ["-u", "editors/neovim/test/interactive.lua", "${@}"]

[tasks.neovim-build]
description = "What the Neovim plugin is tried with: compmd-lsp with its preview's page built fresh, and nvim-treesitter's main branch in target/neovim, which builds the parsers"
clear = true
script = [
  "pnpm --filter @compmd/lsp-preview... build",
  "cargo build -p compmd-lsp",
  "test -d target/neovim/nvim-treesitter || git clone --depth 1 --branch main https://github.com/nvim-treesitter/nvim-treesitter target/neovim/nvim-treesitter",
]

[tasks.helix-check]
description = "The Helix drafts (editors/helix/) in a real Helix, in a tmux session of its own, against local builds: the entry's languages, the two grammars with their queries, and compmd-lsp with its Open preview. Needs hx, tmux and the tree-sitter CLI; not part of ci"
clear = true
dependencies = ["helix-build"]
command = "node"
args = ["editors/helix/test/check.ts", "target/helix/grammars", "target/debug/compmd-lsp"]

[tasks.helix-interactive]
description = "An interactive Helix with the drafts (editors/helix/) against local builds, in place of your own config: `cargo make helix-interactive [file]`, a copy of the Author's Guide's containers example without one. Needs hx and the tree-sitter CLI"
clear = true
dependencies = ["helix-build"]
command = "node"
args = ["editors/helix/test/interactive.ts", "target/helix/grammars", "target/debug/compmd-lsp", "${@}"]

[tasks.emacs-check]
description = "compmd-ts-mode (editors/emacs/) in a batch Emacs against local builds: the mode, the three grammars and compmd-lsp through Eglot. Needs emacs (30 or later) and the tree-sitter CLI; not part of ci"
clear = true
dependencies = ["emacs-build"]
command = "emacs"
args = ["--batch", "-l", "editors/emacs/test/check.el", "target/emacs", "target/debug/compmd-lsp"]

[tasks.emacs-interactive]
description = "An Emacs in the terminal with compmd-ts-mode (editors/emacs/) against local builds, in place of your own config: `cargo make emacs-interactive [file]`, a copy of the Author's Guide's containers example without one. Needs emacs (30 or later) and the tree-sitter CLI"
clear = true
dependencies = ["emacs-build"]
command = "emacs"
args = ["-nw", "-Q", "-l", "editors/emacs/test/interactive.el", "${@}"]

[tasks.emacs-build]
description = "What compmd-ts-mode is tried with: compmd-lsp with its preview's page built fresh, and the three grammars in target/emacs, named as Emacs loads them"
clear = true
script = [
  "pnpm --filter @compmd/lsp-preview... build",
  "cargo build -p compmd-lsp",
  "tree-sitter build -o target/emacs/libtree-sitter-compmd.so grammars/compmd-grammars/tree-sitter/compmd",
  "tree-sitter build -o target/emacs/libtree-sitter-compmd-inline.so grammars/compmd-grammars/tree-sitter/compmd-inline",
  "tree-sitter build -o target/emacs/libtree-sitter-cel.so grammars/compmd-grammars/tree-sitter/cel",
]

[tasks.helix-build]
description = "What the Helix drafts are tried with: compmd-lsp with its preview's page built fresh, and the two parsers in target/helix/grammars"
clear = true
script = [
  "pnpm --filter @compmd/lsp-preview... build",
  "cargo build -p compmd-lsp",
  "tree-sitter build -o target/helix/grammars/compmd.so grammars/compmd-grammars/tree-sitter/compmd",
  "tree-sitter build -o target/helix/grammars/compmd_inline.so grammars/compmd-grammars/tree-sitter/compmd-inline",
]

[tasks.scripts]
description = "Type-check the repository's own tools in `tools/` (`tools/packs/tsconfig.json`), then test them with Node's test runner"
clear = true
script = [
  "pnpm --dir tools/packs exec tsc -p tsconfig.json",
  "node --test tools/spec-revision/spec-revision.test.ts tools/packs/*.test.ts",
]

[tasks.pack-versions]
description = "Fail when compmd-packs/versions.json and the packs disagree (docs/releases.md, decision 8): a pack it doesn't name, or a pack's package.json or export.version that isn't its version there"
clear = true
command = "node"
args = ["tools/packs/versions.ts"]

[tasks.release-packs]
description = "Release every pack whose version in compmd-packs/versions.json npm doesn't have (docs/releases.md, decision 8): writes the versions into the packs' files when they differ, then, on a yes, tags each `<pack>-v<version>` at main's pushed commit, pushes the tags and runs release-packs.yml once. With `--dry-run`, says what it would do and does nothing"
clear = true
command = "node"
args = ["tools/packs/release-packs.ts", "${@}"]

[tasks.approve-packs]
description = "Approve what npm has staged of the packs (docs/releases.md, decision 8): checkboxes, every version waiting for you chosen; Enter approves the chosen ones in the order they were staged, with one one-time code. With `--dry-run`, lists them and approves nothing"
clear = true
command = "node"
args = ["tools/packs/approve-packs.ts", "${@}"]

[tasks.approve-release]
description = "Approve what npm has staged of a release's packages, `@compmd/` (RELEASING.md): checkboxes, every version waiting for you chosen; Enter approves the chosen ones in the order the release workflow staged them, with one one-time code. With `--dry-run`, lists them and approves nothing"
clear = true
command = "node"
args = ["tools/packs/approve-release.ts", "${@}"]

[tasks.pack-placeholders]
description = "Create new packs on npm (docs/releases.md, decision 8): for each named pack npm doesn't have, publish a 0.0.0 placeholder and set its trusted publisher to release-packs.yml, staging only. `cargo make pack-placeholders card chart`; with `--dry-run`, say what it would do and do nothing"
clear = true
command = "node"
args = ["tools/packs/pack-placeholders.ts", "${@}"]

[tasks.release-placeholders]
description = "Create the implementation's new packages before the first release that publishes them (RELEASING.md, *A placeholder first*): for each named `@compmd/` package npm doesn't have, publish a 0.0.0 placeholder and set its trusted publisher to release.yml, staging only; for each named crate crates.io doesn't have, publish a 0.0.0 placeholder crate with `cargo publish` and say how to set its trusted publisher on crates.io. `cargo make release-placeholders @compmd/lsp compmd-lsp`; with `--dry-run`, say what it would do and do nothing"
clear = true
command = "node"
args = ["tools/packs/release-placeholders.ts", "${@}"]

[tasks.spec-revision]
description = "Cut the spec's next revision (docs/releases.md, decision 1): the changelog's `### Unreleased` becomes `1.0-draft.N`, with today's date, in the spec's header and its companion's; commits the three files and tags `spec-v1.0-draft.N`, which `git push --follow-tags` pushes with it. Before a push of spec changes. `cargo make spec-revision --release` cuts the release the draft leads to, `1.0`, tagged `spec-v1.0` (RELEASING.md). Whole or not at all: an existing tag stops it before anything is written, and a commit that fails puts the files back"
clear = true
command = "node"
args = ["tools/spec-revision/spec-revision.ts", "cut", "${@}"]

[tasks.spec-check]
description = "Fail while the spec is dirty: changed since its revision's tag, the tag missing, or entries under `### Unreleased`. Not part of `ci`, so a spec change can be checked before its revision is cut; CI runs it on pushes to `main`, and the release workflow before a release"
clear = true
command = "node"
args = ["tools/spec-revision/spec-revision.ts", "check"]

[tasks.ci]
description = "Every check CI runs; coverage runs the tests, the conformance set's among them, so `test` isn't run again"
clear = true
dependencies = ["fmt", "clippy", "coverage", "doctest", "docs", "wasm", "deny", "packages", "scripts", "pack-versions"]
