# cargo-make tasks for the Rust workspace and the TypeScript packages. `cargo make ci` runs every check.

[config]
# Run each task once for the whole workspace, not once per member crate.
default_to_workspace = false

[tasks.fmt]
description = "Check formatting"
clear = true
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
description = "Lint all targets; warnings are errors"
clear = true
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
description = "Run the tests, the conformance set's among them"
clear = true
command = "cargo"
args = ["test", "--workspace"]

[tasks.doctest]
description = "Run the documentation examples, which coverage's run leaves out"
clear = true
command = "cargo"
args = ["test", "--workspace", "--doc"]

[tasks.wasm]
description = "Build the processor as WebAssembly, size-optimized; `pnpm wasm` in `wasm/` adds wasm-bindgen's JavaScript"
clear = true
command = "cargo"
args = ["build", "--profile", "wasm", "--target", "wasm32-unknown-unknown", "-p", "compmd-wasm"]

[tasks.deny]
description = "Check dependencies: licenses, advisories, sources"
clear = true
command = "cargo"
args = ["deny", "check"]

[tasks.coverage]
description = "Measure line coverage of the workspace's crates; fails below 99%"
clear = true
command = "cargo"
# The markdown-rs fork is a path dependency inside this folder; its coverage is its own. The WebAssembly binding's
# exports and `Intl` run only as WebAssembly, where `@compmd/processor`'s tests cover them; its request is tested
# natively.
args = ["llvm-cov", "--workspace", "--ignore-filename-regex", "markdown-rs/|wasm/src/lib\\.rs", "--fail-under-lines", "99"]

[tasks.packages]
description = "Build, lint (eslint, the type check, svelte-check; after the build, since packages check against each other's built output) and test the TypeScript packages: the renderer, the processor as WebAssembly, the sandbox (its browser tests in Chrome and WebKit), the registry (against a local registry, and in Chrome and WebKit), the Vite plugin (its example app in Chrome and WebKit), `@compmd/pack`, create-pack (a written pack, on `@compmd/pack`, in Chrome and WebKit), the Developer Tools, and the editor (its document of a pack from npm, against a local registry, in Chrome); the renderer's tests check it against the processor's `conformance/params.json`"
clear = true
script = ["pnpm -r --if-present build", "pnpm -r --if-present lint", "pnpm -r --if-present test"]

[tasks.site]
description = "Build the site and check it, as the Pages workflow does before it deploys (docs/ci.md, decision 11): every package's build, the site's last, which assembles them, then the built site's check in Chrome, without the paint timing a shared runner can't hold. Not part of `ci`: a change to the site, the guides or the spec runs it before a push"
clear = true
script = ["pnpm -r build", "pnpm --dir website check --no-timing"]

[tasks.linux]
description = "Run a check on Linux, in a container like CI's runner (docker/Dockerfile), on a commit of this repository: `cargo make linux` runs `cargo make ci` on HEAD; `cargo make linux site` the site's build and check, as the Pages workflow runs them; `cargo make linux <command>` any command; `cargo make linux --ref <commit> …` another commit. Needs Docker; x86-64 runs emulated on an Arm Mac."
clear = true
# The repository's git folder, also when the checkout is a submodule or a worktree, so the container checks out its
# commits and tags; the caches in named volumes, so a later run reuses the build.
script = '''
docker build --platform linux/amd64 --tag compmd-linux docker
docker run --rm --platform linux/amd64 \
  --volume "$(git rev-parse --path-format=absolute --git-common-dir):/git:ro" \
  --volume compmd-linux-target:/work/target \
  --volume compmd-linux-cargo:/usr/local/cargo/registry \
  --volume compmd-linux-cache:/cache \
  compmd-linux ${@}
'''

[tasks.tauri-frames]
description = "Build the frames `tauri-plugin-compmd` embeds into `tauri/frames/` (docs/tauri-plugin.md, decision 2): the sandbox's build, then `buildHashedFrames` for the scheme `compmd`. Before the crate is built, tested or published"
clear = true
script = ["pnpm --filter @compmd/sandbox... build", "node tauri/scripts/frames.mts"]

[tasks.tauri-plugin]
description = "Lint and test `tauri-plugin-compmd`, with its frames, and measure its coverage; fails below 99%. Outside the workspace and `ci`, since it builds Tauri: the Tauri check runs it (docs/tauri-plugin.md, decision 10)"
clear = true
dependencies = ["tauri-frames"]
script = [
  "cargo fmt --manifest-path tauri/Cargo.toml -- --check",
  "cargo clippy --manifest-path tauri/Cargo.toml --all-targets -- -D warnings",
  # A webview's requests come in through `scheme.rs` alone, which only a webview calls: the example app's check
  # covers it.
  "cargo llvm-cov --manifest-path tauri/Cargo.toml --ignore-filename-regex 'tauri/src/scheme\\.rs' --fail-under-lines 99",
  "cargo test --manifest-path tauri/Cargo.toml --doc",
]

[tasks.ci]
description = "Every check CI runs; coverage runs the tests, the conformance set's among them, so `test` isn't run again"
clear = true
dependencies = ["fmt", "clippy", "coverage", "doctest", "wasm", "deny", "packages"]
