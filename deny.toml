# cargo-deny configuration: licenses, advisories and sources of the workspace's dependencies.

[advisories]
# Vulnerabilities and unmaintained crates fail the check; yanked versions too.
yanked = "deny"
# Ignored only because the crates they name come through `cel`, the dev-dependency the processor's CEL tests use as an
# oracle (`crates/processor/src/cel/tests/differential.rs`), never in anything released: its `chrono` feature, for the
# timestamp and duration expressions they compare. `[bans]` below keeps both crates to `cel`, so a dependency that
# brings them in anywhere else fails the check.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained: only through cel, the CEL tests' oracle (dev-only)" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained: only through cel, the CEL tests' oracle (dev-only)" },
]

[licenses]
# Permissive licenses only. A dependency under any other license needs a decision first.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # webpki-roots: Mozilla's root certificates, as data, which ureq checks registries' TLS against (decided with
    # CMD-420).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# The allow list is the policy, so a license no dependency uses yet is fine.
unused-allowed-license = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
# Every version is pinned, except the workspace's own path dependencies.
wildcards = "deny"
allow-wildcard-paths = true
# chrono and chrono-tz are unmaintained (the ignored advisories above): allowed only as cel's, the CEL tests' oracle.
deny = [
    { crate = "chrono", wrappers = ["cel", "chrono-tz"], reason = "unmaintained; only for cel, the CEL tests' oracle" },
    { crate = "chrono-tz", wrappers = ["cel"], reason = "unmaintained; only for cel, the CEL tests' oracle" },
]
