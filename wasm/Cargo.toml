[package]
name = "compmd-wasm"
version = "0.0.1"
description = "The CompMD processor as WebAssembly, for the browser: the binding behind the npm package @compmd/processor."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
compmd = { path = "../processor" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
# Must match the `wasm-bindgen` CLI that builds the package.
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
