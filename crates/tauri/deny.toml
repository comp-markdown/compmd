# cargo-deny configuration of the Tauri plugin, which is outside the workspace (it builds Tauri): the root's policy,
# with what Tauri itself brings in decided one crate at a time.

[advisories]
# Vulnerabilities and unmaintained crates fail the check; yanked versions too.
yanked = "deny"
ignore = [
    # Through gtk3-macros (gtk-rs 0.18), Tauri's GTK on Linux, with no upgrade: remove once Tauri moves to gtk4.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained: only through Tauri's GTK on Linux (gtk-rs 0.18), with no upgrade" },
]

[licenses]
# Permissive licenses only, as the root's. A dependency under any other license needs a decision first.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # webpki-roots: Mozilla's root certificates, as data, which ureq checks registries' TLS against (decided with
    # CMD-420 and CMD-423).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
# MPL-2.0 for these crates only, each through Tauri: a new MPL crate needs its own decision.
exceptions = [
    # Through dom_query, through tauri-utils and wry.
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    # Through dirs, through Tauri.
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
