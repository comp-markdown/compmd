[package]
name = "compmd"
version = "0.11.0"
description = "The CompMD processor: parses, validates and expands CompMD (Component Markdown) documents. In development."
readme = "README.md"
homepage = "https://compmd.dev/"
keywords = ["markdown", "compmd", "commonmark", "components", "parser"]
categories = ["parser-implementations", "text-processing"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# What the crate is built from, its docs and its licence; not its tests and benchmarks, which need the repository.
include = ["/src/**", "/docs/**", "/README.md", "/LICENSE"]

[dependencies]
# The names packs and their files are known by, shared with hosts (re-exported as `compmd::pack`).
compmd-pack.workspace = true
# The expression functions, each written once with its documentation, examples and overloads.
compmd-macros.workspace = true
# CSV and TSV data (spec §8.6), as RFC 4180 reads it.
csv.workspace = true
fixed_decimal = { workspace = true, features = ["ryu"] }
# Formatting by CLDR, with all of ICU4X's compiled locale data, so every `md.lang` formats offline.
icu.workspace = true
# `md.currency`.
icu_experimental.workspace = true
indexmap.workspace = true
markdown.workspace = true
# Import version ranges (`@1`, `@^1.4.2`) matched against a registry's releases.
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
toml = { workspace = true, features = ["parse"] }
# A span for each stage, for a host that installs a subscriber.
tracing.workspace = true
yaml-rust2.workspace = true

[dev-dependencies]
# An oracle for the CEL profile, where it and CEL agree.
cel = { workspace = true, features = ["chrono", "json"] }
# Benchmarks; each iteration is timed with `iter_custom`, for percentiles.
criterion = { workspace = true, features = ["cargo_bench_support"] }
jsonschema.workspace = true
proptest.workspace = true

[[bench]]
name = "edit"
harness = false

[lints]
workspace = true
