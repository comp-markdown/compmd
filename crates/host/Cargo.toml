[package]
name = "compmd-host"
version = "0.11.0"
description = "What every host of CompMD documents shares: the bundle and its manifest, the pack store, and the serving contract, for any platform's adapter. In development."
readme = "README.md"
homepage = "https://compmd.dev/"
keywords = ["compmd", "markdown", "sandbox", "hosting"]
categories = ["web-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# What the crate is built from, its licence, and the serving contract's cases (`fixtures/respond`), which its
# tests and `@compmd/host`'s run.
include = ["/src/**", "/fixtures/**", "/README.md", "/LICENSE"]

[features]
# `compmd::host::Packs` over the bundle and the store, for hosts that process documents in Rust. Off by default, so an
# adapter that only serves (the Tauri plugin) doesn't build the processor.
processor = ["dep:compmd"]
# The registry rules (docs/registry-rules.md): resolving, the policy before a download, checking a tarball and reading
# it, as a state machine a host drives with its own I/O. Off by default, so an adapter that only serves builds none.
registry = ["dep:base64", "dep:miniz_oxide", "dep:sha2", "dep:url"]
# The registry rules driven on a thread of the host's own, fetching with `ureq` and caching in a folder: for a host in
# Rust that fetches from registries itself (the language server).
client = ["registry", "dep:ureq"]
# A registry on the machine serving given packs over npm's protocol, for hosts' tests.
local-registry = ["registry"]

# docs.rs documents `HostPacks` too, which the crate's docs link to.
[package.metadata.docs.rs]
all-features = true

[dependencies]
base64 = { workspace = true, optional = true }
compmd = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# The names packs and their files are known by, as the processor has them.
compmd-pack.workspace = true
# Requests and responses, as every Rust web stack and Tauri's custom schemes speak them.
http.workspace = true
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
# A span for each request answered and each release kept, for a host that installs a subscriber.
tracing.workspace = true

[lints]
workspace = true
