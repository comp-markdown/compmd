[package]
name = "compmd"
version = "0.0.1"
description = "The CompMD processor: parses, validates and expands CompMD (Component Markdown) documents. In development."
readme = "README.md"
keywords = ["markdown", "compmd", "commonmark", "components", "parser"]
categories = ["parser-implementations", "text-processing"]
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not publishable while the fork is a path dependency: crates.io takes no path dependencies. Its release as
# `compmd-markdown` makes the dependency a version, and this line goes.
publish = false

[dependencies]
# CSV and TSV data (spec §8.6), as RFC 4180 reads it.
csv = "1.3.1"
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
# Formatting by CLDR, with all of ICU4X's compiled locale data, so every `md.lang` formats offline.
icu = "2.4.0"
# `md.currency`: ICU4X's currency formatter is still experimental, so its version is pinned.
icu_experimental = "=0.7.0"
indexmap = "2.14.2"
# The fork of markdown-rs with CompMD's syntax (`markdown-rs/`, a submodule), to be published as `compmd-markdown`.
markdown = { path = "../markdown-rs" }
# Import version ranges (`@1`, `@^1.4.2`) matched against a registry's releases.
semver = { version = "1.0.28", features = ["serde"] }
serde ={ version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.18"
yaml-rust2 = "0.13.0"

[dev-dependencies]
# An oracle for the CEL profile, where it and CEL agree.
cel = { version = "0.15.0", default-features = false, features = ["chrono", "json"] }
# Benchmarks; each iteration is timed with `iter_custom`, for percentiles.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
jsonschema = { version = "0.60.2", default-features = false }

[[bench]]
name = "edit"
harness = false

[lints]
workspace = true
