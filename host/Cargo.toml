[package]
name = "compmd-host"
version = "0.6.0"
description = "What every host of CompMD documents shares: the bundle and its manifest, the pack store, and the serving contract, for any platform's adapter. In development."
readme = "README.md"
homepage = "https://compmd.hakanserce.com/"
keywords = ["compmd", "markdown", "sandbox", "hosting"]
categories = ["web-programming"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `compmd::host::Packs` over the bundle and the store, for hosts that process documents in Rust. Off by default, so an
# adapter that only serves (the Tauri plugin) doesn't build the processor.
processor = ["dep:compmd"]

[dependencies]
compmd = { path = "../processor", version = "0.6.0", optional = true }
# Requests and responses, as every Rust web stack and Tauri's custom schemes speak them.
http = "1.3.1"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"

[lints]
workspace = true
