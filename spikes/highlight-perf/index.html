<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Highlighting's cost: a page of many runs</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px/1.4 ui-monospace, monospace; }
      #scroller { height: 100%; overflow-y: auto; }
      .run { border-bottom: 1px solid #ddd; padding: 4px 8px; }
      .run pre { margin: 0; white-space: pre-wrap; }
      /* The large host document of `?churn=1`: rows a host's own rules style. */
      .host .row { padding: 2px 8px; border-bottom: 1px solid #eee; }
      .host .row > span { color: #444; }
      .host .r3 > span, .host .r5 > span { font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="scroller"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
