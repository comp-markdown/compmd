[workspace]
resolver = "3"
members = [
  "crates/processor",
  "crates/components",
  "crates/macros",
  "crates/host",
  "crates/pack-types",
  "crates/project",
  "crates/lsp",
  "npm-packages/wasm",
  "npm-packages/wasm/components",
  "npm-packages/host-js",
]
# The markdown-rs fork and the editors' grammars, submodules with their own workspaces.
exclude = ["crates/markdown-rs", "grammars"]

# The WebAssembly build, optimized for size: `cargo build --profile wasm --target wasm32-unknown-unknown -p compmd-wasm`.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/comp-markdown/compmd"
# The oldest Rust the crates build with: the pinned toolchain's (`rust-toolchain.toml`), the only one they are tested on.
rust-version = "1.99"

# Every dependency's version, once (docs/code/rust.md); a crate adds the features it needs.
[workspace.dependencies]
# The workspace's own crates, at the version they are released at together (docs/releases.md).
compmd = { path = "crates/processor", version = "0.11.0" }
compmd-components = { path = "crates/components", version = "0.11.0" }
compmd-host = { path = "crates/host", version = "0.11.0" }
compmd-macros = { path = "crates/macros", version = "0.11.0" }
compmd-pack = { path = "crates/pack-types", version = "0.11.0" }
compmd-project = { path = "crates/project", version = "0.11.0" }
# The fork of markdown-rs with CompMD's syntax: `crates/markdown-rs/`, a submodule, here; `compmd-markdown` on crates.io.
markdown = { package = "compmd-markdown", path = "crates/markdown-rs", version = "0.2.0" }
# The language server's errors, at its top level (docs/code/rust.md: binaries may use it).
anyhow = "1.0.104"
# An integrity's digest, as npm writes it (`compmd-host`'s registry rules).
base64 = "0.22.1"
cel = { version = "0.15.0", default-features = false }
# The language server's arguments (docs/code/rust.md: every command-line tool parses them with clap).
clap = { version = "4.6.7", features = ["derive"] }
# The channel `lsp-server` speaks over, which the language server's document workers post their results on.
crossbeam-channel = "0.5.15"
criterion = { version = "0.8.2", default-features = false }
csv = "1.3.1"
fixed_decimal = "0.7.3"
# The preview's token, from the system's randomness (the language server's preview; already in the tree through ring).
getrandom = "0.4.3"
http = "1.3.1"
icu = "2.4.0"
# ICU4X's currency formatter is still experimental, so its version is pinned.
icu_experimental = "=0.7.0"
# The language server's project index: a root's Markdown files, skipping what `.gitignore` names (ripgrep's walker;
# docs/language-server.md, Q9).
ignore = "0.4.35"
indexmap = "2.14.2"
jsonschema = { version = "0.60.2", default-features = false }
# A pack's tarball, gunzipped: raw deflate, in pure Rust (`compmd-host`'s registry rules).
miniz_oxide = "0.8.9"
# The language server's protocol, rust-analyzer's crates (docs/language-server.md, decision 2).
lsp-server = "0.7.9"
lsp-types = "0.97.0"
# oxc, a parser for JavaScript and TypeScript: `compmd-components` reads components' props with it.
oxc_allocator = "0.110.0"
oxc_ast = "0.110.0"
oxc_parser = "0.110.0"
oxc_span = "0.110.0"
# `compmd-macros`, the processor's own macros.
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = ["parsing", "printing", "proc-macro", "derive", "clone-impls"] }
# The language server's preview: a project file's path in a URL, decoded (`url`'s own).
percent-encoding = "2.3.2"
# Property tests for algebraic code (docs/code/rust.md).
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
semver = "1.0.28"
serde = "1.0.228"
serde_json = "1.0.145"
# A tarball's SHA-512, against the integrity its registry publishes (`compmd-host`'s registry rules).
sha2 = "0.10.9"
thiserror = "2.0.18"
# The language server's preview: a small synchronous HTTP server on 127.0.0.1 (docs/editor-support.md, decision 8).
tiny_http = "0.12.0"
toml = { version = "0.9", default-features = false }
# The libraries' spans and events (docs/code/rust.md); only a binary installs a subscriber.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# HTTP for the registries a host fetches packs from in Rust: small, synchronous, rustls (the language server, the Tauri
# plugin's proxy).
ureq = "3.5.2"
# A character's display width (East Asian wide characters take two columns): the language server's tables, aligned as
# an editor shows them (docs/editor-rendering.md, decision 7). Already in the lock file through `textwrap`.
unicode-width = "0.2.3"
# WHATWG URLs, as JavaScript's `URL` reads them: a configuration's origins and registries.
url = "2.5.9"
# Must match the `wasm-bindgen` CLI that builds the WebAssembly packages, which CI's setup action and
# `tools/linux-ci/Dockerfile` install at this version.
wasm-bindgen = "=0.2.129"
yaml-rust2 = "0.13.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
