packages:
  - npm-packages/render
  - npm-packages/sandbox
  - npm-packages/devtools
  - npm-packages/registry
  - npm-packages/host-js
  - npm-packages/vite
  - npm-packages/vite/example
  - npm-packages/pack
  - npm-packages/create-pack
  - npm-packages/blog
  - npm-packages/create-blog
  - npm-packages/wasm
  - npm-packages/editor
  - npm-packages/editor/packs/minimermaid
  - compmd-packs/badge
  - compmd-packs/card
  - compmd-packs/figure
  - compmd-packs/gallery
  - compmd-packs/link-card
  - compmd-packs/mermaid
  - compmd-packs/rating
  - compmd-packs/sticky-note
  - compmd-packs/timeline
  - compmd-packs/wireframe
  - crates/tauri/examples/tauri-app
  - guides
  - website
  - website/blog
  # The packs' release tools, for the checkboxes they show; no scripts, as the spikes.
  - tools/packs
  # Spikes: measurements, not packages; they have no build, lint or test script, so the workspace's runs skip them.
  - spikes/*
  - spikes/wrap-npm-package/*

# Install scripts that never run: Paged.js's old dependencies print banners from them, and need nothing built.
allowBuilds:
  core-js: false
  es5-ext: false
