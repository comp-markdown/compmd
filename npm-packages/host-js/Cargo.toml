[package]
name = "compmd-host-wasm"
version = "0.0.1"
description = "compmd-host's serving decision as WebAssembly: the binding behind the npm package @compmd/host."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
compmd-host = { path = "../../crates/host" }
http = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Must match the `wasm-bindgen` CLI that builds the package, and compmd-wasm's.
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
