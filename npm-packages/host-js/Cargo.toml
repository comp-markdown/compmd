[package]
name = "compmd-host-wasm"
version = "0.0.1"
description = "compmd-host's serving decision as WebAssembly: the binding behind the npm package @compmd/host."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The processor's policy types, which a project's configuration is written in.
compmd.workspace = true
# The registry rules, for `@compmd/registry`.
compmd-host = { workspace = true, features = ["registry"] }
# Reading a project, for `@compmd/vite`.
compmd-project.workspace = true
http.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
