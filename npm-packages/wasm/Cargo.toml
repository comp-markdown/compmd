[package]
name = "compmd-wasm"
version = "0.0.1"
description = "The CompMD processor as WebAssembly, for the browser: the binding behind the npm package @compmd/processor."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
compmd.workspace = true
# The versions `newestMatching` is given, read as the processor reads them.
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
