[package]
name = "compmd-components-wasm"
version = "0.0.1"
description = "The CompMD component reader as WebAssembly: the binding behind @compmd/processor/components, a module of its own so a reader's page never loads the parser."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
compmd.workspace = true
compmd-components.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
