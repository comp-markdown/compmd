# The tools this repository's checks need, at the versions a contributor's machine has (the README's commands
# section names them): the Rust toolchain of rust-toolchain.toml with coverage's LLVM tools, the cargo tools and the
# wasm-bindgen CLI, Node and pnpm; with the Rust build and pnpm's store cached. Shared by the CI and site workflows.
name: Set up
description: The Rust toolchain, the cargo tools, Node and pnpm, with caches.
runs:
  using: composite
  steps:
    - name: Rust toolchain (rust-toolchain.toml)
      shell: bash
      run: |
        rustup toolchain install
        rustup component add llvm-tools-preview
    - name: cargo-make, cargo-deny, cargo-llvm-cov, wasm-bindgen
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        tool: cargo-make@0.37.24,cargo-deny@0.20.2,cargo-llvm-cov@0.8.4,wasm-bindgen@0.2.129
    - name: Rust build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: pnpm (package.json's devEngines)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12.14.0
    - name: Node (package.json's devEngines), with pnpm's store cached
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
