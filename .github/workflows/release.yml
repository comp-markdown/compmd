# A release of the implementation (docs/releases.md): a tag v<version> builds and checks the repository, then stages
# @compmd/render, @compmd/processor, @compmd/sandbox, @compmd/registry, @compmd/devtools, @compmd/vite, @compmd/pack and
# @compmd/create-pack on npm with trusted publishing, for the author to approve: GitHub proves to npm which repository
# and workflow publishes, so no npm token is stored, and each version carries its provenance. Then, once the author
# approves it, it publishes the crates compmd-markdown, compmd and tauri-plugin-compmd on crates.io the same way. The Tauri check runs first,
# and nothing is published unless it passes (docs/tauri-plugin.md, decision 10).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, and none cut off halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Tauri check, on Linux, before anything is published (docs/tauri-plugin.md, decision 10).
  tauri:
    uses: ./.github/workflows/tauri.yml

  release:
    needs: tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # The sandbox's, the registry's, the Vite plugin's and create-pack's browser tests run in the runner's Chrome and in Playwright's WebKit.
      - uses: ./.github/actions/webkit
        timeout-minutes: 10
      - name: The tag is every package's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in render wasm sandbox registry devtools vite pack create-pack; do
            written="$(node -p "require('./$package/package.json').version")"
            if [ "$written" != "$version" ]; then
              echo "::error::$package/package.json is $written, the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
          written="$(cargo pkgid -p compmd | sed 's/.*@//')"
          if [ "$written" != "$version" ]; then
            echo "::error::processor/Cargo.toml is $written, the tag $GITHUB_REF_NAME"
            exit 1
          fi
          written="$(cargo metadata --no-deps --format-version 1 --manifest-path tauri/Cargo.toml | jq -r '.packages[0].version')"
          if [ "$written" != "$version" ]; then
            echo "::error::tauri/Cargo.toml is $written, the tag $GITHUB_REF_NAME"
            exit 1
          fi
      # Every check, and every package built.
      - run: cargo make ci
      # The crates packaged as the crates job will publish them, so a package cargo refuses stops the release before
      # anything is published.
      - run: .github/scripts/publish-crates.sh --dry-run
      # pnpm writes the version `workspace:*` stands for into the packages' dependencies on each other.
      - name: Pack
        run: |
          pnpm --dir render pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir wasm pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir sandbox pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir registry pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir devtools pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir vite pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir pack pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir create-pack pack --pack-destination "$RUNNER_TEMP/packages"
      # Trusted publishing needs npm 11.5.1 or newer, staged publishing 11.15.0.
      - run: npm install --global npm@11.21.1
      # Outside the repository, whose devEngines name pnpm; each package after those it depends on. Each is staged: it
      # is installable once the author approves it on npmjs.com, with two-factor authentication (RELEASING.md). A
      # version npm has already is left as it is: a package's first version is published by hand, and a release that
      # failed halfway can run again.
      - name: Stage
        working-directory: ${{ runner.temp }}/packages
        run: |
          publish() {
            name="$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            version="$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is on npm already"
            else
              npm stage publish "$1" --access public
            fi
          }
          publish ./compmd-render-*.tgz
          publish ./compmd-processor-*.tgz
          publish ./compmd-sandbox-*.tgz
          publish ./compmd-registry-*.tgz
          publish ./compmd-devtools-*.tgz
          publish ./compmd-vite-*.tgz
          publish ./compmd-pack-*.tgz
          publish ./compmd-create-pack-*.tgz

  # The crates, once the release's checks passed and its npm packages are staged. crates.io has no staging, and a
  # published version can only be yanked, so the job waits in the environment `crates-io` for its required reviewer,
  # the author, to approve it on GitHub; the crates' trusted publishers on crates.io name this workflow and that
  # environment, so nothing else can publish them (RELEASING.md).
  crates:
    needs: release
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      # Trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # A token for this job alone, which the action revokes when the job ends.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Each crate after those it depends on by version (compmd-markdown and compmd-pack, then compmd, compmd-host and
      # tauri-plugin-compmd), each skipped when crates.io has its version; a version that can't be read stops the job before anything is published. Run
      # with `--dry-run` to try it.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/scripts/publish-crates.sh
