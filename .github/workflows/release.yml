# A release of the implementation (docs/releases.md): a tag v<version> builds and checks the repository, then publishes
# @compmd/render, @compmd/processor, @compmd/sandbox, @compmd/registry, @compmd/vite, @compmd/pack and @compmd/create-pack to npm with trusted publishing: GitHub proves to npm which
# repository and workflow publishes, so no npm token is stored, and each version carries its provenance.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, and none cut off halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # The sandbox's, the registry's, the Vite plugin's and create-pack's browser tests run in the runner's Chrome and in Playwright's WebKit.
      - run: pnpm --dir sandbox exec playwright install --with-deps webkit
      - name: The tag is every package's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in render wasm sandbox registry vite pack create-pack; do
            written="$(node -p "require('./$package/package.json').version")"
            if [ "$written" != "$version" ]; then
              echo "::error::$package/package.json is $written, the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      # Every check, and every package built.
      - run: cargo make ci
      # pnpm writes the version `workspace:*` stands for into the packages' dependencies on each other.
      - name: Pack
        run: |
          pnpm --dir render pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir wasm pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir sandbox pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir registry pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir vite pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir pack pack --pack-destination "$RUNNER_TEMP/packages"
          pnpm --dir create-pack pack --pack-destination "$RUNNER_TEMP/packages"
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11.6.2
      # Outside the repository, whose devEngines name pnpm; each package after those it depends on. A version npm has
      # already is left as it is: a package's first version is published by hand (RELEASING.md), and a release that
      # failed halfway can run again.
      - name: Publish
        working-directory: ${{ runner.temp }}/packages
        run: |
          publish() {
            name="$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            version="$(tar -xzOf "$1" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is on npm already"
            else
              npm publish "$1" --access public
            fi
          }
          publish ./compmd-render-*.tgz
          publish ./compmd-processor-*.tgz
          publish ./compmd-sandbox-*.tgz
          publish ./compmd-registry-*.tgz
          publish ./compmd-vite-*.tgz
          publish ./compmd-pack-*.tgz
          publish ./compmd-create-pack-*.tgz
