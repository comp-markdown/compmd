# CI: every check of the repository, as `cargo make ci` runs it on a contributor's machine (docs/ci.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest commit's answer matters: a newer push to the same branch or pull request cancels the run going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: cargo make ci
