# CI: every check of the repository, as `cargo make ci` runs it on a contributor's machine, and on pushes to `main` the
# published packages' links, with the network (docs/ci.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest commit's answer matters: a newer push to the same branch or pull request cancels the run going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # The sandbox's, the Vite plugin's and create-pack's browser tests run in the runner's Chrome and in Playwright's
      # WebKit. A download that hangs fails the run instead of holding it (it once took 15 minutes and more).
      - uses: ./.github/actions/webkit
        timeout-minutes: 10
      - run: cargo make ci

  # The spec on `main` is a revision, tagged (docs/releases.md, decision 1): a push of spec changes without a revision
  # cut for them fails. On pushes to `main` only: a pull request may carry unreleased spec changes.
  spec-revision:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, for the revision's.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node tools/spec-revision/spec-revision.ts check

  # The links in what npmjs.com, crates.io and docs.rs show of the published packages, with the network: on pushes to
  # `main` only, since a site that is down for a moment shouldn't fail a pull request (docs/ci.md, decision 14).
  links:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --files-from lychee-inputs.txt
          fail: true
