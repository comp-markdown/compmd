# The site on GitHub Pages: the landing page, the playground, the spec, the guides and the blog, built from this repository, checked in
# Chrome, and deployed (website/docs/design.md).
name: Pages

# Deployed from main only, never from a tag (audit B23): a released spec's tag (`spec-v1.0`) is pushed with its commit
# on main (`git push --follow-tags`), and that push's run, which fetches every tag, adds its page (docs/releases.md).
on:
  push:
    branches: [main]
    # Only what the site is built from.
    paths: &site
      - spec/compmd-spec-v1.md
      - spec/compmd-registry-v1.md
      - conformance/**
      - website/**
      - npm-packages/editor/**
      - npm-packages/render/**
      - npm-packages/sandbox/**
      - npm-packages/devtools/**
      - npm-packages/vite/**
      - npm-packages/registry/**
      - npm-packages/blog/**
      - guides/**
      - npm-packages/wasm/**
      - crates/processor/**
      - crates/pack-types/**
      - crates/markdown-rs
      - branding/**
      - pnpm-lock.yaml
      - Cargo.lock
      - .github/workflows/pages.yml
      - .github/actions/setup/**
  # The same build and check before a merge, which deploys nothing (audit B22).
  pull_request:
    branches: [main]
    paths: *site
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and none cut off halfway: a newer run waits for the one going. A pull request's runs
# deploy nothing, so each has its own group, and a newer push cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Every tag, for the released versions of the spec.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # The processor as WebAssembly, the renderer, the playground, then the site, which assembles them.
      - run: pnpm -r build
      # The runner's Chrome; the paint budget is measured locally, since a shared runner's timings vary.
      - run: pnpm --dir website check --no-timing
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
