[package]
name = "tauri-plugin-compmd"
version = "0.7.0"
description = "The Tauri adapter of CompMD's hosting: embeds the bundle @compmd/vite writes, serves it on a scheme of the app's own, and gives the page its origin. In development."
readme = "README.md"
homepage = "https://compmd.hakanserce.com/"
keywords = ["tauri", "tauri-plugin", "compmd", "markdown", "sandbox"]
categories = ["gui", "web-programming"]
edition = "2024"
license = "MIT"
repository = "https://github.com/comp-markdown/compmd"
include = ["src/**", "README.md"]

# Outside the repository's workspace, so its CI doesn't build Tauri; the Tauri check builds and tests it
# (docs/tauri-plugin.md, decisions 1 and 10).
[workspace]

[features]
# `build::bundle`, for the app's `build.rs`: embeds the bundle (docs/tauri-plugin.md, decision 3).
build = []
# `app.compmd().packs()`, the processor's `Packs` over the bundle and the store, for an app that processes documents in
# Rust. Off by default, so an app that processes in its page doesn't build the processor.
processor = ["compmd-host/processor"]

[dependencies]
compmd-host = { path = "../host", version = "0.7.0" }
serde_json = "1.0.145"
tauri = "2.12"
thiserror = "2.0.18"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
